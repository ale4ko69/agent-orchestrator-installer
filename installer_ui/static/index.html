<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Orchestrator Installer</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #18202f;
    }
    body {
      margin: 0;
      padding: 32px;
    }
    main {
      max-width: 1080px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 20px;
    }
    section {
      background: #fff;
      border: 1px solid #d9dfeb;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #c8d0df;
      border-radius: 6px;
      font-size: 14px;
    }
    .grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-top: 12px;
    }
    .pack {
      border: 1px solid #d9dfeb;
      border-radius: 6px;
      padding: 10px;
      min-height: 72px;
    }
    .pack span {
      display: block;
      font-size: 12px;
      color: #566174;
      margin-top: 4px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    button {
      border: 1px solid #1f5fbf;
      background: #1f5fbf;
      color: #fff;
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }
    button.secondary {
      background: #fff;
      color: #1f5fbf;
    }
    pre {
      background: #101624;
      color: #e5ecff;
      padding: 14px;
      border-radius: 6px;
      overflow: auto;
      min-height: 180px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>Agent Orchestrator Installer</h1>

    <section>
      <label for="configPath">Config Path</label>
      <input id="configPath" type="text" value="project.config.json">

      <label for="targets" style="margin-top: 14px;">Install Targets</label>
      <input id="targets" type="text" value="copilot,codex">

      <div class="actions">
        <button id="refreshPacks" class="secondary">Refresh Packs</button>
        <button id="checkTools" class="secondary">Check Tools</button>
        <button id="runDiff">Diff Preview</button>
      </div>
    </section>

    <section>
      <label>Packs</label>
      <div id="packs" class="grid"></div>
    </section>

    <section>
      <label>Output</label>
      <pre id="output">Ready.</pre>
    </section>
  </main>

  <script>
    const packsEl = document.getElementById('packs');
    const outputEl = document.getElementById('output');
    const configPathEl = document.getElementById('configPath');
    const targetsEl = document.getElementById('targets');

    function selectedPacks() {
      return Array.from(document.querySelectorAll('input[name="pack"]:checked')).map((input) => input.value);
    }

    function show(value) {
      outputEl.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
    }

    async function refreshPacks() {
      const response = await fetch('/api/packs');
      const data = await response.json();
      packsEl.innerHTML = '';
      for (const pack of data.packs || []) {
        const wrapper = document.createElement('label');
        wrapper.className = 'pack';
        wrapper.innerHTML = `
          <input type="checkbox" name="pack" value="${pack.id}">
          ${pack.name || pack.id}
          <span>${pack.id}</span>
          <span>${pack.description || ''}</span>
        `;
        packsEl.appendChild(wrapper);
      }
      show(data);
    }

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body)
      });
      return response.json();
    }

    document.getElementById('refreshPacks').addEventListener('click', refreshPacks);
    document.getElementById('checkTools').addEventListener('click', async () => {
      const data = await postJson('/api/tools/check', {
        configPath: configPathEl.value,
        packs: selectedPacks()
      });
      show((data.stdout || '') + (data.stderr || ''));
    });
    document.getElementById('runDiff').addEventListener('click', async () => {
      const data = await postJson('/api/install/diff', {
        configPath: configPathEl.value,
        installTargets: targetsEl.value,
        packs: selectedPacks()
      });
      show((data.stdout || '') + (data.stderr || ''));
    });

    refreshPacks().catch((error) => show(String(error)));
  </script>
</body>
</html>
