<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Orchestrator Installer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f6;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --line: #d8dee8;
      --line-strong: #b8c2d1;
      --text: #172033;
      --muted: #5f6d80;
      --primary: #2457a6;
      --primary-strong: #173e78;
      --success: #18734f;
      --warning: #9b5b08;
      --danger: #a73737;
      --code-bg: #111827;
      --code-text: #dbe7ff;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      min-height: 64px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    h1 {
      font-size: 18px;
      line-height: 1.2;
      margin: 0;
      font-weight: 760;
      letter-spacing: 0;
    }

    .repo {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: min(64vw, 760px);
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 12px;
      font-size: 13px;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
    }

    .status.ok .status-dot {
      background: var(--success);
    }

    .status.error .status-dot {
      background: var(--danger);
    }

    main {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 20px 24px 24px;
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      grid-template-rows: minmax(520px, 1fr) 280px;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
      overflow: hidden;
    }

    .panel-header {
      min-height: 52px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel-soft);
    }

    .panel-title {
      font-weight: 760;
      font-size: 14px;
      letter-spacing: 0;
    }

    .panel-count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .settings {
      display: grid;
      align-content: start;
    }

    .form {
      padding: 16px;
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label,
    .label {
      font-size: 12px;
      font-weight: 760;
      color: #2f3c50;
    }

    input[type="text"],
    .search {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      min-height: 38px;
      padding: 8px 10px;
      outline: none;
    }

    input[type="text"]:focus,
    .search:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(36, 87, 166, 0.12);
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    .segment {
      min-height: 38px;
      display: grid;
      place-items: center;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      font-weight: 650;
    }

    .segment:last-child {
      border-bottom: 0;
    }

    .segment:nth-child(even) {
      border-right: 0;
    }

    .segment:nth-last-child(-n + 2) {
      border-bottom: 0;
    }

    .segment:last-child:nth-child(odd) {
      grid-column: 1 / -1;
    }

    .segment input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .segment:has(input:checked) {
      background: #eaf1fb;
      color: var(--primary-strong);
      box-shadow: inset 0 0 0 1px rgba(36, 87, 166, 0.16);
    }

    .target-list {
      display: grid;
      gap: 8px;
    }

    .check-row {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: #fff;
      cursor: pointer;
    }

    .check-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    .check-row span {
      font-size: 13px;
      font-weight: 650;
    }

    .actions {
      display: grid;
      gap: 10px;
      padding-top: 4px;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
      gap: 10px;
    }

    button {
      min-height: 40px;
      border-radius: 6px;
      border: 1px solid transparent;
      padding: 0 13px;
      cursor: pointer;
      font-weight: 760;
      color: #fff;
      background: var(--primary);
    }

    button:hover {
      background: var(--primary-strong);
    }

    button.secondary {
      background: #fff;
      color: var(--primary-strong);
      border-color: var(--line-strong);
    }

    button.secondary:hover {
      background: #f2f6fb;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .packs-panel {
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .toolbar {
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 10px;
      background: #fff;
    }

    .pack-grid {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      align-content: start;
      gap: 10px;
      overflow: auto;
    }

    .pack {
      min-height: 130px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      cursor: pointer;
    }

    .pack:hover {
      border-color: var(--line-strong);
      box-shadow: 0 8px 20px rgba(30, 47, 74, 0.08);
    }

    .pack.selected {
      border-color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(36, 87, 166, 0.28);
    }

    .pack-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
    }

    .pack-name {
      font-size: 14px;
      line-height: 1.25;
      font-weight: 760;
    }

    .pack-id {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
      overflow-wrap: anywhere;
    }

    .pack input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      margin-top: 1px;
      flex: 0 0 auto;
    }

    .pack-desc {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .pack-meta {
      min-height: 22px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 0 8px;
      background: #eef5f1;
      color: var(--success);
      font-size: 11px;
      font-weight: 760;
    }

    .chip.external {
      background: #fff3df;
      color: var(--warning);
    }

    .config-summary {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-soft);
      color: var(--muted);
      display: grid;
      gap: 5px;
      min-height: 44px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.35;
    }

    .config-summary strong {
      color: var(--text);
    }

    .write-gate {
      border-color: #eed3aa;
      background: #fff8ed;
    }

    .write-gate span {
      color: #5a3a10;
      line-height: 1.3;
    }

    .console {
      grid-column: 1 / -1;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .console-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
    }

    pre {
      margin: 0;
      background: var(--code-bg);
      color: var(--code-text);
      overflow: auto;
      padding: 14px 16px;
      font: 12px/1.5 Consolas, "Cascadia Mono", "Liberation Mono", monospace;
      white-space: pre-wrap;
    }

    .empty {
      color: var(--muted);
      padding: 24px;
      font-size: 13px;
    }

    @media (max-width: 980px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(460px, 1fr) 300px;
        padding: 14px;
      }

      .console {
        grid-column: auto;
      }
    }

    @media (max-width: 560px) {
      .topbar {
        padding: 12px 14px;
      }

      .toolbar,
      .button-row {
        grid-template-columns: 1fr;
      }

      .segmented {
        grid-template-columns: 1fr;
      }

      .segment {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .segment:nth-last-child(-n + 2) {
        border-bottom: 1px solid var(--line);
      }

      .segment:last-child {
        border-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Agent Orchestrator Installer</h1>
        <div id="repoRoot" class="repo">Connecting...</div>
      </div>
      <div id="status" class="status">
        <span class="status-dot"></span>
        <span id="statusText">Idle</span>
      </div>
    </header>

    <main>
      <section class="panel settings" aria-labelledby="settingsTitle">
        <div class="panel-header">
          <div id="settingsTitle" class="panel-title">Run Setup</div>
        </div>

        <div class="form">
          <div class="field">
            <label for="configPath">Config Path</label>
            <input id="configPath" type="text" value="project.config.json" spellcheck="false">
            <div id="configSummary" class="config-summary">Config not checked yet.</div>
          </div>

          <div class="field">
            <div class="label">Mode</div>
            <div class="segmented" role="group" aria-label="Run mode">
              <label class="segment">
                <input type="radio" name="mode" value="diff" checked>
                Diff
              </label>
              <label class="segment">
                <input type="radio" name="mode" value="dry-run">
                Dry Run
              </label>
              <label class="segment">
                <input type="radio" name="mode" value="install">
                Install
              </label>
              <label class="segment">
                <input type="radio" name="mode" value="update-only">
                Update
              </label>
              <label class="segment">
                <input type="radio" name="mode" value="analyze-project">
                Analyze
              </label>
              <label class="segment">
                <input type="radio" name="mode" value="analyze-only">
                Analyze Only
              </label>
              <label class="segment">
                <input type="radio" name="mode" value="check-tools">
                Tools
              </label>
            </div>
          </div>

          <div class="field">
            <div class="label">Install Targets</div>
            <div class="target-list">
              <label class="check-row">
                <input type="checkbox" name="target" value="copilot" checked>
                <span>Copilot</span>
              </label>
              <label class="check-row">
                <input type="checkbox" name="target" value="claude">
                <span>Claude</span>
              </label>
              <label class="check-row">
                <input type="checkbox" name="target" value="codex" checked>
                <span>Codex</span>
              </label>
            </div>
          </div>

          <label class="check-row write-gate">
            <input id="confirmWrite" type="checkbox">
            <span>Allow write modes for install, update, and analysis</span>
          </label>

          <div class="actions">
            <button id="primaryAction">Run Diff</button>
            <div class="button-row">
              <button id="loadConfig" class="secondary">Load</button>
              <button id="draftConfig" class="secondary">Draft</button>
              <button id="validateConfig" class="secondary">Validate</button>
              <button id="checkTools" class="secondary">Check Tools</button>
              <button id="refreshPacks" class="secondary">Refresh Packs</button>
            </div>
          </div>
        </div>
      </section>

      <section class="panel packs-panel" aria-labelledby="packsTitle">
        <div class="panel-header">
          <div id="packsTitle" class="panel-title">Pack Registry</div>
          <div id="packCount" class="panel-count">0 selected</div>
        </div>

        <div class="toolbar">
          <input id="packSearch" class="search" type="text" placeholder="Filter packs" spellcheck="false">
          <button id="clearPacks" class="secondary">Clear</button>
        </div>

        <div id="packs" class="pack-grid">
          <div class="empty">Loading packs...</div>
        </div>
      </section>

      <section class="panel console" aria-labelledby="consoleTitle">
        <div class="panel-header">
          <div id="consoleTitle" class="panel-title">Command Output</div>
          <div id="commandMeta" class="console-meta">No command yet</div>
        </div>
        <pre id="output">Ready.</pre>
      </section>
    </main>
  </div>

  <script>
    const packsEl = document.getElementById('packs');
    const outputEl = document.getElementById('output');
    const configPathEl = document.getElementById('configPath');
    const statusEl = document.getElementById('status');
    const statusTextEl = document.getElementById('statusText');
    const repoRootEl = document.getElementById('repoRoot');
    const configSummaryEl = document.getElementById('configSummary');
    const packCountEl = document.getElementById('packCount');
    const commandMetaEl = document.getElementById('commandMeta');
    const packSearchEl = document.getElementById('packSearch');
    const primaryActionEl = document.getElementById('primaryAction');
    const confirmWriteEl = document.getElementById('confirmWrite');
    const actionButtons = Array.from(document.querySelectorAll('button'));

    let packRegistry = [];
    const selectedPackIds = new Set();
    const writeModes = new Set(['install', 'update-only', 'analyze-project', 'analyze-only']);

    function selectedPacks() {
      return Array.from(selectedPackIds);
    }

    function selectedTargets() {
      return Array.from(document.querySelectorAll('input[name="target"]:checked')).map((input) => input.value);
    }

    function setSelectedTargets(targets) {
      const selected = new Set(Array.isArray(targets) ? targets : []);
      for (const input of document.querySelectorAll('input[name="target"]')) {
        input.checked = selected.has(input.value);
      }
    }

    function selectedMode() {
      return document.querySelector('input[name="mode"]:checked')?.value || 'diff';
    }

    function updatePrimaryAction() {
      const labels = {
        diff: 'Run Diff',
        'dry-run': 'Run Dry Run',
        install: 'Run Install',
        'update-only': 'Run Update',
        'analyze-project': 'Run Analysis',
        'analyze-only': 'Run Analyze Only',
        'check-tools': 'Check Tools'
      };
      const mode = selectedMode();
      primaryActionEl.textContent = labels[mode] || 'Run';
      primaryActionEl.disabled = writeModes.has(mode) && !confirmWriteEl.checked;
    }

    function setBusy(isBusy) {
      for (const button of actionButtons) {
        button.disabled = isBusy;
      }
      if (isBusy) {
        statusEl.className = 'status';
        statusTextEl.textContent = 'Running';
      } else {
        updatePrimaryAction();
      }
    }

    function setStatus(kind, text) {
      statusEl.className = `status ${kind}`;
      statusTextEl.textContent = text;
    }

    function show(value, meta = '') {
      outputEl.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
      commandMetaEl.textContent = meta || 'No command yet';
    }

    function renderConfigSummary(data) {
      if (!data.ok) {
        const missing = Array.isArray(data.missing) && data.missing.length ? ` Missing: ${data.missing.join(', ')}.` : '';
        configSummaryEl.innerHTML = `<strong>Invalid config.</strong>${escapeHtml(missing || ` ${data.error || ''}`)}`;
        return;
      }
      const summary = data.summary || {};
      const targets = Array.isArray(summary.installTargets) ? summary.installTargets.join(', ') : String(summary.installTargets || '');
      configSummaryEl.innerHTML = `
        <strong>${escapeHtml(summary.projectName || 'Project')}</strong>
        <span>${escapeHtml(summary.projectRoot || data.path || '')}</span>
        <span>Targets: ${escapeHtml(targets || 'default')}</span>
      `;
    }

    function applyConfigSelection(data) {
      const summary = data.summary || {};
      if (Array.isArray(summary.installTargets) && summary.installTargets.length) {
        setSelectedTargets(summary.installTargets);
      }
      if (Array.isArray(summary.enabledPacks)) {
        selectedPackIds.clear();
        for (const packId of summary.enabledPacks) {
          selectedPackIds.add(String(packId));
        }
        renderPacks();
      }
      updatePrimaryAction();
    }

    function updatePackCount() {
      const count = selectedPacks().length;
      const total = packRegistry.length;
      packCountEl.textContent = `${count} selected / ${total} total`;
      for (const card of packsEl.querySelectorAll('.pack')) {
        const input = card.querySelector('input');
        card.classList.toggle('selected', Boolean(input?.checked));
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function renderPacks() {
      const query = packSearchEl.value.trim().toLowerCase();
      const selected = new Set(selectedPacks());
      const packs = packRegistry.filter((pack) => {
        const haystack = `${pack.id || ''} ${pack.name || ''} ${pack.description || ''}`.toLowerCase();
        return !query || haystack.includes(query);
      });

      if (!packs.length) {
        packsEl.innerHTML = '<div class="empty">No packs found.</div>';
        updatePackCount();
        return;
      }

      packsEl.innerHTML = packs.map((pack) => {
        const tools = Array.isArray(pack.externalTools) ? pack.externalTools : [];
        const targets = Array.isArray(pack.targets) ? pack.targets : [];
        const checked = selected.has(pack.id) ? 'checked' : '';
        const toolChip = tools.length ? `<span class="chip external">${tools.length} tools</span>` : '';
        const defaultChip = pack.defaultEnabled ? '<span class="chip">default</span>' : '';
        const targetChip = targets.length ? `<span class="chip">${targets.length} targets</span>` : '';
        return `
          <label class="pack">
            <div class="pack-top">
              <div>
                <div class="pack-name">${escapeHtml(pack.name || pack.id)}</div>
                <div class="pack-id">${escapeHtml(pack.id)}</div>
              </div>
              <input type="checkbox" name="pack" value="${escapeHtml(pack.id)}" ${checked}>
            </div>
            <div class="pack-desc">${escapeHtml(pack.description || '')}</div>
            <div class="pack-meta">${defaultChip}${toolChip}${targetChip}</div>
          </label>
        `;
      }).join('');

      for (const input of packsEl.querySelectorAll('input[name="pack"]')) {
        input.addEventListener('change', () => {
          if (input.checked) {
            selectedPackIds.add(input.value);
          } else {
            selectedPackIds.delete(input.value);
          }
          updatePackCount();
        });
      }
      updatePackCount();
    }

    async function getJson(url) {
      const response = await fetch(url);
      return response.json();
    }

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body)
      });
      return response.json();
    }

    function commandText(data) {
      const command = Array.isArray(data.command) ? data.command.join(' ') : '';
      const output = `${data.stdout || ''}${data.stderr || ''}`.trimEnd();
      return `${command ? `$ ${command}\n\n` : ''}${output || '(no output)'}`;
    }

    async function refreshHealth() {
      const data = await getJson('/api/health');
      repoRootEl.textContent = data.repoRoot || 'Local installer';
      setStatus(data.ok ? 'ok' : 'error', data.ok ? 'Ready' : 'Offline');
    }

    async function refreshPacks() {
      setBusy(true);
      try {
        const data = await getJson('/api/packs');
        packRegistry = Array.isArray(data.packs) ? data.packs : [];
        renderPacks();
        show(`Loaded ${packRegistry.length} packs.`, '--list-packs-json');
        setStatus('ok', 'Packs loaded');
      } catch (error) {
        show(String(error), 'pack registry');
        setStatus('error', 'Failed');
      } finally {
        setBusy(false);
      }
    }

    async function checkTools() {
      await runMode('check-tools');
    }

    async function runDiff() {
      await runMode('diff');
    }

    async function validateConfig() {
      setBusy(true);
      try {
        const data = await postJson('/api/config/validate', { configPath: configPathEl.value });
        renderConfigSummary(data);
        show(data, 'config validation');
        setStatus(data.ok ? 'ok' : 'error', data.ok ? 'Config ok' : 'Config issue');
      } catch (error) {
        show(String(error), 'config validation');
        setStatus('error', 'Failed');
      } finally {
        setBusy(false);
      }
    }

    async function loadConfig() {
      setBusy(true);
      try {
        const data = await postJson('/api/config/load', { configPath: configPathEl.value });
        renderConfigSummary(data);
        if (data.ok) {
          applyConfigSelection(data);
        }
        show(data, 'config load');
        setStatus(data.ok ? 'ok' : 'error', data.ok ? 'Config loaded' : 'Config issue');
      } catch (error) {
        show(String(error), 'config load');
        setStatus('error', 'Failed');
      } finally {
        setBusy(false);
      }
    }

    async function draftConfig() {
      setBusy(true);
      try {
        const data = await postJson('/api/config/draft', {
          configPath: configPathEl.value,
          installTargets: selectedTargets().join(','),
          packs: selectedPacks()
        });
        if (data.validation) {
          renderConfigSummary(data.validation);
        }
        show(data.draftJson || data, 'config draft');
        setStatus(data.ok ? 'ok' : 'error', data.ok ? 'Draft ready' : 'Draft issue');
      } catch (error) {
        show(String(error), 'config draft');
        setStatus('error', 'Failed');
      } finally {
        setBusy(false);
      }
    }

    async function runMode(mode = selectedMode()) {
      if (writeModes.has(mode) && !confirmWriteEl.checked) {
        show(`Mode "${mode}" can write files. Enable the write confirmation checkbox first.`, mode);
        setStatus('error', 'Confirmation required');
        updatePrimaryAction();
        return;
      }
      setBusy(true);
      try {
        const data = await postJson('/api/install/run', {
          configPath: configPathEl.value,
          mode,
          installTargets: selectedTargets().join(','),
          packs: selectedPacks(),
          noSecondStepPrompt: true,
          confirmWrite: confirmWriteEl.checked
        });
        show(commandText(data), `exit ${data.exitCode}`);
        const okLabels = {
          diff: 'Diff ready',
          'dry-run': 'Dry run ready',
          install: 'Install done',
          'update-only': 'Update done',
          'analyze-project': 'Analysis done',
          'analyze-only': 'Analysis done',
          'check-tools': 'Tools ok'
        };
        const failLabels = {
          diff: 'Diff failed',
          'dry-run': 'Dry run failed',
          install: 'Install failed',
          'update-only': 'Update failed',
          'analyze-project': 'Analysis failed',
          'analyze-only': 'Analysis failed',
          'check-tools': 'Tools missing'
        };
        setStatus(data.ok ? 'ok' : 'error', data.ok ? okLabels[mode] : failLabels[mode]);
      } catch (error) {
        show(String(error), mode);
        setStatus('error', 'Failed');
      } finally {
        setBusy(false);
      }
    }

    async function runPrimaryAction() {
      await runMode(selectedMode());
    }

    document.getElementById('refreshPacks').addEventListener('click', refreshPacks);
    document.getElementById('checkTools').addEventListener('click', checkTools);
    document.getElementById('validateConfig').addEventListener('click', validateConfig);
    document.getElementById('loadConfig').addEventListener('click', loadConfig);
    document.getElementById('draftConfig').addEventListener('click', draftConfig);
    document.getElementById('clearPacks').addEventListener('click', () => {
      selectedPackIds.clear();
      for (const input of document.querySelectorAll('input[name="pack"]')) input.checked = false;
      updatePackCount();
    });
    primaryActionEl.addEventListener('click', runPrimaryAction);
    packSearchEl.addEventListener('input', renderPacks);
    confirmWriteEl.addEventListener('change', updatePrimaryAction);
    for (const input of document.querySelectorAll('input[name="mode"]')) {
      input.addEventListener('change', updatePrimaryAction);
    }
    updatePrimaryAction();

    refreshHealth()
      .then(loadConfig)
      .then(refreshPacks)
      .catch((error) => {
        show(String(error), 'startup');
        setStatus('error', 'Failed');
      });
  </script>
</body>
</html>
